server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/leaderboard}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/leaderboard}
    user: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

leaderboard:
  cache-ttl-hours: 48
  max-entries: 100

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}