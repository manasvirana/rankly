services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      PGTZ: UTC
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
